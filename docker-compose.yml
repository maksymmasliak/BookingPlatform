x-php: &php
    image: booking-php-dev
    build:
        context: .
        dockerfile: docker/php/Dockerfile
        target: dev
        args:
            UID: ${UID:-1000}
            GID: ${GID:-1000}
    environment:
        DATABASE_URL: "postgresql://booking:booking@postgres:5432/booking_platform?serverVersion=18&charset=utf8"
    volumes:
        - .:/var/www/html

services:
    composer:
        <<: *php
        command: ["composer", "install", "--no-interaction", "--prefer-dist"]

    migrate:
        <<: *php
        command: ["php", "bin/console", "doctrine:migrations:migrate", "--no-interaction", "--allow-no-migration"]
        depends_on:
            composer:
                condition: service_completed_successfully
            postgres:
                condition: service_healthy

    app:
        <<: *php
        restart: unless-stopped
        depends_on:
            migrate:
                condition: service_completed_successfully

    nginx:
        image: nginx:stable-alpine
        restart: unless-stopped
        ports:
            - "127.0.0.1:8080:80"
        volumes:
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
            - ./public:/var/www/html/public:ro
        depends_on:
            - app

    postgres:
        image: postgres:18-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: booking_platform
            POSTGRES_USER: booking
            POSTGRES_PASSWORD: booking
        volumes:
            - pg_data:/var/lib/postgresql
        ports:
            - "127.0.0.1:5432:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U booking -d booking_platform"]
            interval: 5s
            timeout: 3s
            retries: 10

volumes:
    pg_data:
